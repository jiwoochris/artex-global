# Example pre-commit configuration (official docs: https://pre-commit.com)
#
# Runs the repository CI's two deterministic merge gates at local commit time first, so a broken
# change is caught before it is pushed. If an assertion in either hook fails, it exits with a
# non-zero code and the commit stops.
#
# 1) detections — only on commits that change the detection rules (detections/), the upstream
#    sources those rules pin, or the inline Sigma templates in the defense guide
#    (docs/defense-{ko,en}.md), runs the runner that executes the eight detection tests and three
#    gates in one go (detections/tests/run-all.sh). It enforces the same rule/source scope as CI
#    (.github/workflows/detections.yml) up front, catching changes that edit only the rules without
#    updating the tests/layers, or that fix a defense template without updating the guide's claims
#    about it. Requirement: Docker (each test runs isolated in a container, and nothing is
#    installed on the runner).
# 2) docs — checks that in-repo links, images and anchor (#heading) references in tracked Markdown
#    documents point at targets that actually exist (scripts/check-doc-links.py). It is the same
#    check as CI (.github/workflows/docs.yml), and to match CI running it on every change without a
#    paths filter, the target files are not narrowed here either (always_run). Links break not
#    only when a .md is edited but also when the file a link pointed to (an image, LICENSE, etc.)
#    is deleted or moved. It uses only the Python standard library and makes no network
#    connections, so it finishes in a few tens of ms without Docker.
#
# Install:      pip install pre-commit && pre-commit install
# Run manually: pre-commit run detections --all-files
#               pre-commit run docs --all-files
#
# A minimal example that wires up just two hooks. To also add Go/web linting, append your own hooks below.
repos:
  - repo: local
    hooks:
      - id: detections
        name: 탐지 규칙 테스트 8종 (Sigma·Suricata·ATT&CK·지표·MISP)
        entry: detections/tests/run-all.sh
        language: script
        pass_filenames: false
        files: '^(detections/|enrich/enrich\.go|selfupdate/(github|stage)\.go|guard/guard\.go|db/db\.go|db/schema\.sql|cmd/artex/main\.go|traffic/traffic\.go|docs/defense-(ko|en)\.md)'
      - id: docs
        name: 문서 내부 링크·이미지·앵커(#헤딩) 무결성 검사
        entry: python3 -I scripts/check-doc-links.py
        language: system
        pass_filenames: false
        always_run: true
