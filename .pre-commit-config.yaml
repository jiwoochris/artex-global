# Example pre-commit configuration (official docs: https://pre-commit.com)
#
# Runs the same two deterministic merge gates as CI at local commit time, so a
# broken change is caught before it is pushed. Any failing assertion exits
# non-zero and stops the commit.
#
# 1) detections -- runs the eight detection tests and three gates at once
#    (detections/tests/run-all.sh) only on commits that touch the detection
#    rules (detections/), the upstream sources those rules pin, or the inline
#    Sigma templates in the defence guide (docs/defense.md). It uses the same
#    rule and source scope as CI (.github/workflows/detections.yml), which
#    catches a rule change that forgets to update its tests and layers, or a
#    defence-template edit that leaves the guide's claims stale. Requires
#    Docker: every test runs isolated in a container and the runner installs
#    nothing.
# 2) docs -- checks that every repository-internal link, image and anchor
#    (#heading) reference in the tracked Markdown points at something that
#    exists (scripts/check-doc-links.py). Same check as CI
#    (.github/workflows/docs.yml); that one runs on every change without a
#    paths filter, so this config does not narrow the target files either
#    (always_run). Links break as easily when the referenced file (an image,
#    LICENSE, ...) is deleted or moved as when the Markdown itself is edited.
#    Standard library only, no network, so it finishes in milliseconds without
#    Docker.
#
# Install:        pip install pre-commit && pre-commit install
# Run manually:   pre-commit run detections --all-files
#
# This is the minimal example with just those two hooks. Add your own Go and web
# lint hooks below if you want them in the same loop.
repos:
  - repo: local
    hooks:
      - id: detections
        name: detection rule tests (Sigma, Suricata, ATT&CK, indicators, MISP)
        entry: detections/tests/run-all.sh
        language: script
        pass_filenames: false
        files: '^(detections/|enrich/enrich\.go|selfupdate/(github|stage)\.go|guard/guard\.go|db/db\.go|db/schema\.sql|cmd/artex/main\.go|traffic/traffic\.go|docs/defense-(ko|en)\.md)'
      - id: docs
        name: internal doc links, images and anchors (#heading) integrity check
        entry: python3 -I scripts/check-doc-links.py
        language: system
        pass_filenames: false
        always_run: true
