name: ci
# Runs build, static analysis and tests on every push and PR, catching regressions introduced by
# the Korean localization before merge. The release workflow (release.yml) runs only on tags (v*)
# and only builds and deploys, so validating day-to-day changes is this workflow's job.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs build, static analysis and tests without a database. This reproduces exactly the
  # environment of a contributor who clones the repository and runs `go test ./...` without
  # PostgreSQL. Integration tests that need a database are skipped via t.Skipf here (a skip
  # counts as a pass), so the build, go vet and the unit tests that don't use the DB must all
  # be green. This combination alone is enough to catch, before merge, regressions that cross
  # package boundaries (e.g. changing wording in one package and breaking another package's
  # test assertions).
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test (DB 없음 — 통합 테스트는 스킵)
        run: go test ./... -count=1

  # Runs the DB integration tests that need a real PostgreSQL (notifications, evidence, usage
  # metering, etc.). It forces the paths the go job above skips (notification channel
  # validation, evidence storage, llm_usage metering, etc.) through a real database, catching
  # even the Korean localization regressions that show up only on DB integration paths before merge.
  #
  # Upstream's test harness is designed so that all packages share one database, create tables
  # only once and reuse them, and implicitly depend on package execution order and accumulated
  # data, so running everything against a single database breaks in several different ways
  # (accumulated-data contamination, connection teardown races, cross-package schema
  # dependencies on reset). So here each package gets its own PostgreSQL service and runs in
  # isolation as "empty database + single package". Each package runs as an independent job
  # (matrix) and never touches the others' data, connections or schema, so those three
  # conflicts disappear structurally. db.Open auto-migrates the schema, and for tables db.Open
  # does not create, such as llm_usage, each test ensures them itself with EnsureLLMUsageTable.
  go-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, evidence, llmrec, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test (DB 통합 · ${{ matrix.pkg }} 패키지 격리)
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1
