name: ci
# Runs build, static analysis and tests on every push and pull request, so regressions
# introduced while de-Koreanising the repository are caught before merge. The release
# workflow (release.yml) runs only on tags (v*) and only builds and publishes, so
# verifying everyday changes is this workflow's job.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the previous run, so rapid pushes do not queue
# redundant build+test runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs build, static analysis and tests without a database. This reproduces the
  # environment a contributor gets after cloning the repository and running `go test ./...`
  # without PostgreSQL. Integration tests that need a database call t.Skipf here (a skip
  # counts as a pass), so every build, `go vet` and DB-free unit test has to be green.
  # That combination alone already catches cross-package regressions before merge (for
  # example changing a message in one package while breaking another package's assertion).
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # go.mod is the single source of truth (it pins a patch release).
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test (no database - integration tests are skipped)
        run: go test ./... -count=1

  # Owns the DB integration tests that need a real PostgreSQL (notifications, evidence,
  # usage metering, ...). It forces the paths the `go` job skips (notification channel
  # validation, evidence storage, llm_usage metering, ...) against a real database, so
  # regressions that only show up on the DB integration path are also caught before merge.
  #
  # The upstream test harness was designed around every package sharing one database,
  # creating the tables once and reusing them, and implicitly depending on package
  # execution order and accumulated data. Running everything against one database breaks in
  # several different ways (accumulated-data pollution, connection teardown races,
  # cross-package schema dependencies on reset), so each package here gets its own
  # PostgreSQL service and runs isolated as "empty database + single package". Every package
  # runs as its own job (matrix), so it never touches another package's data, connections or
  # schema, and those three conflicts disappear structurally. db.Open migrates the schema
  # automatically, and tables db.Open does not create (llm_usage) are ensured by each test
  # itself through EnsureLLMUsageTable.
  go-db:
    runs-on: ubuntu-latest
    # Six packages, each with its own PostgreSQL service: allow for image pulls.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, evidence, llmrec, server]
    services:
      postgres:
        # Digest-pinned (multi-arch index) so an upstream retag cannot change CI.
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # go.mod is the single source of truth (it pins a patch release).
          go-version-file: go.mod
          cache: true
      - name: go test (DB integration - ${{ matrix.pkg }} package in isolation)
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1

  # Lints the workflows themselves: expression typos, unknown contexts, invalid `needs`,
  # bad `runs-on` values and shell problems in `run:` blocks (it uses the runner's
  # shellcheck). Without this, a typo in a workflow only shows up when the workflow runs —
  # which for release.yml means on a tag, when it is most expensive.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Pinned so a red/green change cannot depend on when the job ran.
      - name: actionlint (workflow syntax, expressions and run-block shell)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
