name: detections
# On every push and PR that changes the detection rules (Sigma, Suricata, ATT&CK layer), verifies
# with reproduction tests that the rules actually fire, convert to multiple SIEM backends, that the
# coverage layer matches the rules, that the indicators still match the upstream sources, and that
# the rules pass the full SigmaHQ conventions validation. A change that edits only the rules
# without updating the tests/layer shows up red here. This is the workflow that actually backs, as
# a merge gate, the promise made by CONTRIBUTING.md and detections/tests/README.md that "eight
# tests mechanically enforce the contribution contract". Go build/static analysis/tests are
# handled by ci.yml.
# In addition to the eight tests, three non-rule gates run in the same merge gate: the harness
# registry sync check, the self-test of the host triage tool
# (detections/triage/artex_host_triage.py), and the consistency check of the inline Sigma
# correlation template embedded as prose in the defense guide (docs/defense-{ko,en}.md). All three
# are separate from the eight rule tests, and run-all.sh runs them the same way. The third gate
# reproduces the facts the defense guide asserts about that template (passes `sigma check`,
# converts to splunk/eql/loki, correlation unsupported on lucene/kusto, identical ko/en rule
# bodies), catching at the merge gate the case where upstream sigma-cli or a backend is bumped and
# the prose silently goes stale.
#
# The eight tests need only Docker (the ubuntu-latest runner ships with Docker). The runner pulls
# the sigma-cli, scapy, suricata and python images and runs them isolated in containers, so
# nothing is installed on the runner itself, and the rule tree and the source files the
# indicators point at are mounted read-only, so nothing is written to the repository. Besides
# changes under detections/, it also runs when a source file pinned by the indicator test
# changes: the User-Agent, markers and destructive-command tokens in enrich, selfupdate, guard and
# db; the default listen and proxy ports in cmd/artex/main.go; the MITM CA certificate file name
# in traffic/traffic.go; and the exploration-graph schema fingerprint in db/schema.sql. This
# catches at the merge gate the case where a source change alters an indicator and the
# rule/indicator list silently goes stale. Public Docker images are pulled without
# authentication, so it may occasionally hit the Docker Hub pull rate limit; re-running the job
# resolves that.
on:
  push:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      # The two files read by the third gate (defense template consistency check). If this template
      # changes it must be re-verified, so they are included in the trigger.
      - "docs/defense-ko.md"
      - "docs/defense-en.md"
      - ".github/workflows/detections.yml"
  pull_request:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      - "docs/defense-ko.md"
      - "docs/defense-en.md"
      - ".github/workflows/detections.yml"

permissions:
  contents: read

# When a new push arrives on the same branch, cancel the earlier run so that needless runs
# don't pile up while pushing frequently.
concurrency:
  group: detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 테스트 하네스 레지스트리 동기 검사 (run-all.sh ↔ CI ↔ 디렉터리)
        run: detections/tests/check-harness-sync.sh
      - name: 호스트 트리아지 도구 자가 테스트 (artex_host_triage.py --self-test · 규칙 아닌 게이트)
        run: detections/tests/triage-selftest.sh
      - name: 방어 가이드 인라인 Sigma 템플릿 정합 검사 (sigma check·변환 매트릭스·ko/en 본문 동일 · 규칙 아닌 게이트)
        run: detections/tests/check-defense-template.sh
      - name: Sigma 규칙 재현 테스트 (sigma check + 백엔드 변환 + 지표 보존)
        run: detections/tests/sigma/run.sh
      - name: Sigma 실제 이벤트 매칭 테스트 (원자·상관 규칙이 악성 샘플/타임라인에 발화·정상에 침묵)
        run: detections/tests/sigma_match/run.sh
      - name: Sigma SigmaHQ 관례 린트 (전체 검증기 세트 + 문서화된 기준)
        run: detections/tests/sigma_lint/run.sh
      - name: Sigma 백엔드 이식성 테스트 (상관 규칙이 여러 백엔드에서 변환되는지 확인)
        run: detections/tests/sigma_backends/run.sh
      - name: Suricata 규칙 재현 테스트 (pcap 합성 → suricata -r → 경보 수 단언)
        run: detections/tests/suricata/run.sh
      - name: ATT&CK 레이어 ↔ 규칙 정합 테스트
        run: detections/tests/attack/run.sh
      - name: 탐지 지표 ↔ 상류 소스 일치 테스트 (상류 재동기화 드리프트 가드)
        run: detections/tests/indicators/run.sh
      - name: 지표 MISP 내보내기 ↔ CSV 동기화 테스트 (pymisp 로 MISP 형식 유효성 검증)
        run: detections/tests/misp/run.sh
