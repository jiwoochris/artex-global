name: detections
# On every push and pull request that changes the detection rules (Sigma, Suricata,
# ATT&CK layer), verifies by re-running them that the rules actually fire, convert to
# several SIEM backends, keep the coverage layer in line with the rules, still match
# the upstream sources the indicators point at, and pass the full SigmaHQ convention
# set. A change that edits rules without updating the tests or the layer turns red
# here. This workflow is what backs, at the merge gate, the promise CONTRIBUTING.md and
# detections/tests/README.md make: "eight test suites mechanically enforce the
# contribution contract". Go build, static analysis and tests live in ci.yml.
# Alongside the eight suites, three non-suite gates run in the same merge gate: the
# harness-registry sync check, the self-test of the host-triage tool
# (detections/triage/artex_host_triage.py), and the consistency check of the inline
# Sigma correlation template that lives as prose in the defense guide
# (docs/defense.md). All three are separate from the eight rule suites and
# run-all.sh runs them too. The third gate reproduces the facts the guide asserts
# about that template (`sigma check` passes · converts on splunk/eql/loki ·
# lucene/kusto do not support the correlation), so that an upstream sigma-cli or
# backend upgrade that silently makes the prose stale is caught at the merge gate.
#
# The eight suites need only Docker (the ubuntu-latest runner ships with it). The
# runner pulls the sigma-cli, scapy, suricata and python images and runs them
# isolated in containers, so nothing is installed on the runner itself, and the rule
# tree and the source files the indicators point at are mounted read-only, so nothing
# is written to the repository. Besides changes under detections/, it also runs when a
# source file pinned by the indicator tests changes: the enrich, selfupdate, guard and
# db User-Agents, marker and destructive-command tokens, the default listen and proxy
# ports in cmd/artex/main.go, the MITM CA certificate filename in traffic/traffic.go,
# and the exploration-graph schema fingerprint in db/schema.sql. That catches a source
# change that silently makes the rules and the indicator list stale. The public Docker
# images are pulled without authentication, so the Docker Hub pull rate limit can
# occasionally be hit; re-running the job clears it.
on:
  push:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      # The file the third gate (defense-template consistency) reads. Included in the
      # trigger because the template must be re-verified when it changes.
      - "docs/defense.md"
      - ".github/workflows/detections.yml"
  pull_request:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      - "docs/defense.md"
      - ".github/workflows/detections.yml"

permissions:
  contents: read

# A new push to the same branch cancels the previous run, so frequent pushes do not
# pile up unnecessary runs.
concurrency:
  group: detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Test-harness registry sync check (run-all.sh ↔ CI ↔ directories)
        run: detections/tests/check-harness-sync.sh
      - name: Host-triage tool self-test (artex_host_triage.py --self-test · not a rule suite)
        run: detections/tests/triage-selftest.sh
      - name: Defense-guide inline Sigma template consistency (sigma check · conversion matrix · not a rule suite)
        run: detections/tests/check-defense-template.sh
      - name: Sigma rule reproduction test (sigma check + backend conversion + indicator preservation)
        run: detections/tests/sigma/run.sh
      - name: Sigma live event-matching test (atomic and correlation rules fire on malicious samples/timelines, stay silent on benign)
        run: detections/tests/sigma_match/run.sh
      - name: SigmaHQ convention lint (full validator set + documented baseline)
        run: detections/tests/sigma_lint/run.sh
      - name: Sigma backend portability test (verifies the correlation rules convert on several backends)
        run: detections/tests/sigma_backends/run.sh
      - name: Suricata rule reproduction test (synthesize pcap → suricata -r → assert alert count)
        run: detections/tests/suricata/run.sh
      - name: ATT&CK layer ↔ rule consistency test
        run: detections/tests/attack/run.sh
      - name: Detection-indicator ↔ upstream-source match test (upstream re-sync drift guard)
        run: detections/tests/indicators/run.sh
      - name: Indicator MISP export ↔ CSV sync test (validates the MISP format with pymisp)
        run: detections/tests/misp/run.sh
