name: external-links
# Checks that the external links the tracked Markdown points at are still alive (the
# incident-reporting channels in the defense guide - boho.or.kr, privacy.go.kr,
# pipc.go.kr, fsec.or.kr - plus CISA KEV, OWASP, SigmaHQ, Suricata, MITRE, MISP, the
# original demo, the GitHub badges, and so on). Whether an external URL still resolves
# depends on the network and on remote server policy, so it is flaky and deliberately kept
# out of the internal-link merge gate (docs.yml). That is why this workflow runs on a weekly
# schedule and on manual dispatch (workflow_dispatch) instead of on push/PR: it **never
# blocks a merge**, and when an external link rots or is taken down the periodic run shows
# up red. Internal links and anchors belong to docs.yml, Go build, analysis and tests to
# ci.yml, the detection rules to detections.yml, and the web UI build to web.yml.
#
# --strict fails only when there is at least one DOWN (404/410/5xx, DNS or connection
# error) that the allowlist (scripts/external-links-allowlist.txt) does not cover.
# RESTRICTED (bot blocked, rate limited - the host is alive) and ALLOWED (dead links
# inherited from upstream that we cannot fix) do not count as failures, so a red run means
# "a curated external link in our docs just broke - go look". Scheduled workflows only run
# on the default branch (main).
on:
  schedule:
    - cron: "17 0 * * 1" # every Monday at 00:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # python3 ships with the ubuntu-latest runner and the script uses only the standard
      # library, so nothing needs installing. -I isolates the user site and environment.
      - name: External link liveness check (browser UA, GET, redirects followed, allowlist excluded, non-blocking for merges)
        run: python3 -I scripts/check-external-links.py --strict
