name: external-links
# Checks that the external links referenced by tracked Markdown (the incident-reporting channels
# in the defense guide boho.or.kr, privacy.go.kr, pipc.go.kr, fsec.or.kr, CISA KEV, OWASP, SigmaHQ,
# Suricata, MITRE, MISP, the original demo, GitHub badges, etc.) are still alive. External URL
# liveness depends on the network and remote server policies and is flaky, so the internal-link
# merge gate (docs.yml) does not look at it. That is why this workflow runs only on a weekly
# schedule and on manual dispatch (workflow_dispatch), not on push/PR, so it **does not block
# merges**; when an external link degrades or goes away, the periodic run shows it in red.
# Internal links/anchors are handled by docs.yml, Go build/analysis/tests by ci.yml, detection
# rules by detections.yml, and the Korean UI build by web.yml.
#
# --strict fails only when there is at least one DOWN (404, 410, 5xx, DNS/connection error) that
# is not in the allowlist (scripts/external-links-allowlist.txt). RESTRICTED (the host is alive
# but bot-blocking, rate limiting, etc.) and ALLOWED (dead links inherited from upstream that we
# cannot fix) do not count as failures, so a red run is a signal that "an external link curated
# by our docs has newly broken — go take a look". Scheduled workflows run only on the default
# branch (main).
on:
  schedule:
    - cron: "17 0 * * 1" # every Monday at 00:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # python3 is preinstalled on the ubuntu-latest runner and the script uses only the standard
      # library, so nothing extra is installed. -I runs it isolated from the user site-packages and environment.
      - name: 외부 링크 생존 점검 (브라우저 UA·GET·리다이렉트 추적 · allowlist 제외 · 머지 비차단)
        run: python3 -I scripts/check-external-links.py --strict
