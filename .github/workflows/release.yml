name: release
on:
  push:
    tags: ["v*"]

# No workflow-level permissions: the GITHUB_TOKEN defaults to the repository's configured
# default (read/write on older repositories), so every job states its own. Only `release`
# may write contents, only `docker` may push packages; the jobs that run third-party
# install code (`frontend` runs `pnpm install`) get a read-only token.
permissions: {}

# Two publishes for the same tag must not overlap, but a running release is never
# cancelled halfway: a half-published release leaves a GitHub Release without its image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1) Export the frontend statically once; every target cross-compile reuses the artifact
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # pnpm postinstall scripts run here; nothing needs write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # pnpm/action-setup takes the version from "packageManager" in web/package.json, so
      # the runner uses the same pnpm the lockfile was generated with.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      # No `cache: pnpm` here on purpose: this workflow publishes signed artifacts, and a
      # cache entry written by an untrusted pull-request run is restorable here (cache
      # poisoning). A cold install costs about a minute on a tag build.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run build:static
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/out

  # 2) Cross-compile for the two Linux targets (with the frontend embedded) and package a zip
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Caching disabled for the same reason as setup-node above: this job feeds the
      # published release and the container image.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_PNPM_INSTALL: "1"
          # A UPX self-extracting ELF crashes under some Linux kernels, virtualisation and
          # security policies. Releases prefer portability: the Go linker strip plus zip
          # compression only.
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      # The arm64 binary cannot run natively on the amd64 runner, so it runs under QEMU
      # inside an arm64 container. This catches a broken arm64 build before the image is
      # pushed, instead of at the first arm64 user.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: matrix.goarch == 'arm64'
      - name: Smoke test Linux arm64 binary (QEMU)
        if: matrix.goarch == 'arm64'
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist/artex-linux-arm64:/d:ro" \
            alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f \
            /d/artex -h
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Upload the raw Linux binary separately so the docker job can reuse it (the image
      # must not rebuild frontend + Go inside itself)
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # 3) Collect every zip -> create the GitHub Release
  release:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # required to create the Release
      id-token: write      # required by the build-provenance attestation
      attestations: write  # required by the build-provenance attestation
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      # Integrity limit, stated on purpose: this sums file is published unsigned next to the
      # artifacts it describes, so it detects corruption and CDN tampering but not a
      # compromised release. The one-click updater (selfupdate/github.go + stage.go) fetches
      # SHA256SUMS and the binary from the same channel, over TLS, with no signature — see
      # docs/docker.md §6. A real fix needs a detached signature (minisign or
      # Sigstore/cosign) produced here from a key the maintainer holds, the public half
      # compiled into the binary, and a verification step before the swap; without a key
      # under CI control nothing can actually sign yet, so this stays a documented gap.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.zip > SHA256SUMS
      # Signed provenance for the zips and the checksum file, so a downloader can verify
      # that these bytes came from this workflow and this commit. It complements (does not
      # replace) the missing checksum signature documented above: `gh attestation verify`
      # checks the attestation against the repository's OIDC identity, which needs no key
      # held by the maintainer.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      # Kept instead of a hand-written `gh release create`: the action handles asset
      # upload retries, release notes and re-runs against an existing release, which is
      # exactly the state a re-tagged or resumed publish lands in.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true

  # 4) Multi-architecture image -> pushed to GitHub Container Registry (ghcr.io). It reuses
  #    the Linux binaries the `binaries` job built, and the image only installs the tools and
  #    places the binary; arm64 then emulates just the apt layer, which is far faster.
  #    Login uses the workflow's default GITHUB_TOKEN, so no extra secret is needed. The
  #    upstream autumn27/artex (Docker Hub) is gone and this fork has no push rights to that
  #    namespace, so images are published to the ghcr namespace this fork owns.
  docker:
    needs: [binaries]
    runs-on: ubuntu-latest
    # Multi-arch build with QEMU: the apt layer of the arm64 leg is emulated.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAMESPACE: ghcr.io/yukiteruamano/artex-global
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (brings in the Dockerfile and skills/)
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAMESPACE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM and max-mode provenance are attached to the image manifest, so a consumer
          # can inspect what went in and where it was built: `docker buildx imagetools
          # inspect ghcr.io/<namespace>:<tag>` shows the attestation manifests.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
