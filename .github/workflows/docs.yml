name: docs
# On every push and PR, checks that in-repo link and image references in tracked Markdown
# documents point at files that exist, and that document anchor links (#heading) point at
# headings that actually exist in the target document, preventing broken links, images and
# anchors from being merged. The files a link points to can live anywhere in the repository
# (e.g. ../LICENSE, screenshots/en/*.png), so it runs on every change with no paths
# filter. External URLs (http/https/mailto) depend on the network and are flaky, so they
# are not checked — scripts/check-doc-links.py looks only at internal references.
# It uses only the Python standard library and makes no network connections, so it
# finishes deterministically and doesn't flake on external factors such as Docker Hub rate
# limits. Go build/static analysis/tests are handled by ci.yml, detection-rule
# reproduction by detections.yml, and the Korean UI build by web.yml.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# When a new push arrives on the same branch, cancel the earlier run so needless runs don't pile up.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # python3 is preinstalled on the ubuntu-latest runner, and the script uses only the
      # standard library, so no separate install step is needed. -I runs it isolated from
      # the user site-packages and environment.
      - name: 문서 내부 링크·이미지·앵커 무결성 검사
        run: python3 -I scripts/check-doc-links.py
