name: docs
# On every push and pull request, checks that the repository-internal links and image
# references in the tracked Markdown documents point at files that exist, and that
# document anchor links (#heading) point at headings the target document actually has,
# so that broken links, images and anchors cannot merge. The files a link points at can
# live anywhere in the repository (e.g. ../LICENSE or screenshots/en/*.png), so this runs
# on every change without a paths filter. External URLs (http/https/mailto) are not
# checked because they depend on the network and are flaky — scripts/check-doc-links.py
# looks only at internal references. It uses only the Python standard library and makes
# no network access, so it finishes deterministically and never flakes on an external
# factor such as a Docker Hub rate limit. Go build, static analysis and tests are handled
# by ci.yml, detection-rule reproduction by detections.yml, and the web UI build by
# web.yml.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the previous run, so unnecessary runs do not pile up.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # python3 ships with the ubuntu-latest runner and the script uses only the
      # standard library, so no separate install step is needed. -I isolates the user
      # site and environment.
      - name: Document internal link, image and anchor integrity check
        run: python3 -I scripts/check-doc-links.py
      # Language gate (SPEC.md §3): English is the source language and the only
      # non-English text allowed is the Spanish catalogue plus the sentinels and
      # fixtures listed in SPEC.md §3.5.1. The baseline records today's allowed
      # counts, so this fails when new non-English text appears or a count grows.
      - name: Language gate (no new non-English text)
        run: python3 -I scripts/check-non-english.py
