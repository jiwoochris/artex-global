name: web
# Runs the static export build of the Korean UI (web/) on every push and PR, catching frontend
# regressions before merge. The release workflow (release.yml) builds web only on tags (v*), but
# this fork has no history of tag pushes, so it has never run — that is why validating
# day-to-day web changes (TypeScript, React, i18n, next-intl) is this workflow's job. The Go
# side's build/tests are handled by ci.yml, so this runs only when web/ changes (paths filter).
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  # The static export build is a merge gate. `NEXT_EXPORT=1 next build` also performs TypeScript
  # type checking, because next.config has no typescript.ignoreBuildErrors setting, so if there
  # is a type error or an export failure this job stops red and blocks the merge.
  #
  # The biome lint is a merge gate too. After the pre-existing lint debt inherited from upstream
  # (G7) was cleaned up to 0 (errors 8→0: skills tree a11y 6 + package.json formatter 1 +
  # logo.svg noSvgWithoutTitle 1), the informational step was promoted to a gate. Now if
  # `npm run check` (biome check) reports an error, this job stops red and blocks the merge,
  # preventing regressions that dirty the cleaned-up state again.
  # Warnings and info do not affect the exit code (biome is non-zero only at the error level), so they don't block merges.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: 단위 테스트 (머지 게이트 · vitest)
        # Catches regressions in pure logic (getInitials/formatCurrency, i18n config, statusMeta) and in i18n key consistency before merge.
        run: npm run test -- --run
      - name: i18n 로케일 키 정합성 (머지 게이트 · ko 기준 5개 로케일 일치)
        # Checks, using ko.json as the reference, that the key sets of en/zh/es/ja are exactly the same (both missing and extra keys fail).
        run: npm run check:i18n
      - name: build:static (머지 게이트 · 타입 검사 포함)
        run: npm run build:static
      - name: UI 한자 누출 가드 (머지 게이트 · out HTML 에 중국어 0)
        # This fork's core achievement is that "there is no Chinese on any user-facing screen".
        # It blocks, before merge, regressions where a contributor hard-codes Chinese or a translation is missing.
        # The script finds web/out under the git root by itself, so it does not depend on the working directory.
        run: python3 -I ../scripts/check-web-cjk.py
      - name: biome check (머지 게이트 · lint·format·a11y 오류 0 유지)
        if: always()
        run: npm run check
