name: web
# Runs the web UI's static export build (web/) on every push and pull request, so
# frontend regressions are caught before merge. The release workflow (release.yml) only
# builds web on tags (v*), and this fork has no tag-push history, so that path has never
# run -- verifying everyday web changes (TypeScript, React, i18n, next-intl) is this
# workflow's job. Go builds and tests belong to ci.yml, so this one only runs when web/
# changes (paths filter).
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

# A new push to the same branch cancels the previous run.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The static export build is the merge gate. `NEXT_EXPORT=1 next build` also runs the
  # TypeScript type check, because next.config does not set typescript.ignoreBuildErrors,
  # so a type error or a failed export turns this job red and blocks the merge.
  #
  # The biome lint is a merge gate too. The lint debt inherited from upstream was cleared
  # to zero and the informational step was promoted to a gate: `pnpm run check` (biome
  # check) errors turn this job red and block the merge, so the clean state cannot be
  # silently re-dirtied. Warnings and infos do not affect the exit code (biome is non-zero
  # only at the error level) and do not block a merge.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # pnpm/action-setup takes the version from "packageManager" in web/package.json.
      # It has to run before setup-node, otherwise `cache: pnpm` cannot find pnpm.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Unit tests (merge gate - vitest)
        # Catches regressions in pure logic (getInitials/formatCurrency, i18n config, statusMeta)
        # and in i18n key consistency before merge.
        run: pnpm run test --run
      - name: i18n locale key consistency (merge gate - identical key sets per locale)
        # Checks that every locale's key set matches the reference locale exactly (both a
        # missing and an extra key fail).
        run: pnpm run check:i18n
      - name: build:static (merge gate - includes type checking)
        run: pnpm run build:static
      - name: CJK leak guard (merge gate - zero Chinese characters in the exported HTML)
        # This fork's core promise is that no user-visible screen contains Chinese text.
        # This blocks the regression where a contributor hardcodes Chinese or a translation
        # is missed. The script locates web/out from the git root itself, so the working
        # directory does not matter.
        run: python3 -I ../scripts/check-web-cjk.py
      - name: biome check (merge gate - keep lint, format and a11y at zero errors)
        if: always()
        run: pnpm run check
